<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reap2027.com | REAP 2027 Counselling</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f7fb;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:650px;
    width:100%;
    background:#fff;
    padding:50px 35px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.badge{
    display:inline-block;
    background:#eef4ff;
    color:#2563eb;
    padding:8px 18px;
    border-radius:50px;
    font-size:14px;
    font-weight:600;
    margin-bottom:20px;
}

h1{
    font-size:42px;
    margin-bottom:15px;
    color:#111827;
    word-break:break-word;
}

p{
    color:#6b7280;
    font-size:18px;
    line-height:1.7;
    margin-bottom:30px;
}

.btn{
    display:inline-block;
    background:#2563eb;
    color:#fff;
    text-decoration:none;
    padding:15px 32px;
    border-radius:8px;
    font-size:17px;
    font-weight:600;
    transition:.3s;
}

.btn:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
}

.note{
    margin-top:30px;
    font-size:14px;
    color:#9ca3af;
}

@media (max-width:600px){

    .container{
        padding:35px 22px;
    }

    h1{
        font-size:30px;
    }

    p{
        font-size:16px;
    }

    .btn{
        width:100%;
    }

}
</style>

</head>
<body>

<div class="container">

    <div class="badge">🌐 Premium Domain</div>

    <h1>Reap2027.com / Reap-Counselling.in</h1>

    <p>
        These domain names are available for sale.
        If you're interested in purchasing them, we'd love to hear from you.
    </p>

    <a href="https://www.famral.com/contact" class="btn">
        Contact Us
    </a>

    <div class="note">
        Serious inquiries only.
    </div>

</div>

</body>
</html>
